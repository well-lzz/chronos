<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>chronos console</title>
<style>
:root{color-scheme:light dark;--bd:#8883;--mut:#8886}
*{box-sizing:border-box}
body{font:14px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;margin:0;padding:1rem;max-width:72rem;margin:0 auto}
h1{font-size:1.2rem;margin:.2rem 0 .8rem}
.tiles{display:flex;flex-wrap:wrap;gap:.6rem;margin-bottom:1rem}
.tile{border:1px solid var(--bd);border-radius:.5rem;padding:.5rem .8rem;min-width:6rem}
.tile b{display:block;font-size:1.3rem}
.tile span{color:var(--mut);font-size:.8rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(13rem,1fr));gap:.5rem}
.ch{border:1px solid var(--bd);border-radius:.5rem;padding:.5rem;cursor:default}
.ch .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ch .meta{color:var(--mut);font-size:.78rem}
.dot{display:inline-block;width:.6rem;height:.6rem;border-radius:50%;margin-right:.35rem;vertical-align:middle}
.solved{background:#2e7d32}.active{background:#1565c0}.preparing{background:#b8860b}.deferred{background:#b00020}.unsolved{background:#888}
.row{display:flex;gap:1rem;flex-wrap:wrap;margin-top:1rem}
.panel{flex:1;min-width:20rem;border:1px solid var(--bd);border-radius:.5rem;padding:.7rem}
.agent{display:flex;justify-content:space-between;gap:.5rem;padding:.2rem 0;border-bottom:1px solid var(--bd);cursor:pointer}
.agent:hover{background:#8881}
button{font:inherit;border:1px solid var(--bd);background:transparent;border-radius:.4rem;padding:.2rem .5rem;cursor:pointer}
#log{font:12px/1.45 ui-monospace,Menlo,monospace;white-space:pre-wrap;max-height:22rem;overflow:auto;background:#8881;padding:.5rem;border-radius:.4rem}
.ev{margin-bottom:.4rem}.ev .k{color:var(--mut)}
input,select{font:inherit;padding:.25rem .4rem;border:1px solid var(--bd);border-radius:.4rem;background:transparent}
.muted{color:var(--mut)}
</style>
</head>
<body>
<h1>chronos console <span class="muted" id="budget"></span></h1>
<div class="tiles" id="tiles"></div>
<div>
  <label class="muted">filter
    <select id="filter">
      <option value="">all</option><option>active</option><option>preparing</option>
      <option>deferred</option><option>unsolved</option><option>solved</option>
    </select>
  </label>
  <button onclick="cmd('resume_all','')">resume all deferred</button>
</div>
<div class="grid" id="grid" style="margin-top:.6rem"></div>

<div class="row">
  <div class="panel">
    <b>Swarms</b>
    <div id="swarms"></div>
  </div>
  <div class="panel">
    <b>Watch: <span id="watchlabel" class="muted">pick an executor</span></b>
    <div id="controls" style="margin:.4rem 0;display:none">
      <button onclick="cmd('pause',W.c)">pause</button>
      <button onclick="cmd('resume',W.c)">resume</button>
      <button onclick="cmd('kill',W.c)">kill</button>
      <input id="bumpmsg" placeholder="guidance to the agent…" style="width:12rem">
      <button onclick="bump()">send</button>
    </div>
    <div id="log"></div>
  </div>
</div>

<script>
let STATE={summary:{},challenges:[],swarms:{}};
const W={c:null,m:null,after:0};

function tile(label,val){return `<div class="tile"><b>${val??0}</b><span>${label}</span></div>`}
function render(){
  const s=STATE.summary||{};
  document.getElementById('tiles').innerHTML=
    tile('solved',s.solved)+tile('unsolved',s.unsolved)+tile('active',s.active)+
    tile('preparing',s.preparing)+tile('deferred',s.deferred)+tile('tokens',s.total_tokens);
  document.getElementById('budget').textContent=
    (s.budget_left_min!=null&&s.budget_left_min>=0)?`· budget ${s.budget_left_min}min left`:'';
  const f=document.getElementById('filter').value;
  document.getElementById('grid').innerHTML=(STATE.challenges||[])
    .filter(c=>!f||c.status===f)
    .sort((a,b)=>(b.value-a.value)||a.name.localeCompare(b.name))
    .map(c=>`<div class="ch"><div class="nm"><span class="dot ${c.status}"></span>${esc(c.name)}</div>
      <div class="meta">${c.value}pts · L${c.level} · ${esc(c.category||'')} · ${c.correct_flag_count}/${c.flag_count} · ${c.status}</div></div>`).join('');
  const sw=STATE.swarms||{};
  document.getElementById('swarms').innerHTML=Object.keys(sw).length?Object.entries(sw).map(([n,st])=>{
    const agents=st.agents||{};
    return Object.entries(agents).map(([m,a])=>
      `<div class="agent" onclick="watch('${esc(n)}','${esc(m)}')"><span>${esc(n)} / ${esc(m)}</span><span class="muted">${a.status} · ${a.steps} steps${st.paused?' · paused':''}</span></div>`).join('');
  }).join(''):'<div class="muted">no active swarms</div>';
}
function esc(s){return (s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function watch(c,m){W.c=c;W.m=m;W.after=0;document.getElementById('watchlabel').textContent=c+' / '+m;
  document.getElementById('controls').style.display='';document.getElementById('log').innerHTML='';}
async function pollActivity(){
  if(W.c&&W.m){
    try{const r=await fetch(`/api/activity?challenge=${encodeURIComponent(W.c)}&model=${encodeURIComponent(W.m)}&after=${W.after}`);
      const j=await r.json();const log=document.getElementById('log');
      (j.events||[]).forEach(e=>{W.after=Math.max(W.after,e.step);
        const d=document.createElement('div');d.className='ev';
        d.innerHTML=`<span class="k">#${e.step} ${esc(e.kind)}${e.tool?' '+esc(e.tool):''}</span>\n${esc(e.text)}`;
        log.appendChild(d);});
      if((j.events||[]).length)log.scrollTop=log.scrollHeight;
    }catch(e){}
  }
  setTimeout(pollActivity,1200);
}
async function cmd(action,challenge,extra){
  await fetch('/api/command',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify(Object.assign({action,challenge},extra||{}))});
}
function bump(){const m=document.getElementById('bumpmsg').value.trim();if(!m||!W.c)return;
  cmd('bump',W.c,{model:W.m,message:m});document.getElementById('bumpmsg').value='';}
document.getElementById('filter').onchange=render;
const es=new EventSource('/api/stream');
es.onmessage=e=>{try{STATE=JSON.parse(e.data);render();}catch(_){}} ;
es.onerror=()=>{/* auto-reconnect */};
fetch('/api/state').then(r=>r.json()).then(s=>{STATE=s;render();});
pollActivity();
</script>
</body>
</html>
