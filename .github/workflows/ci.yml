name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...
      - run: go test -race ./...
      - run: go install honnef.co/go/tools/cmd/staticcheck@latest
      - run: staticcheck ./...
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: govulncheck ./...

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  tsecbench-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker buildx build --platform linux/amd64 --load -f Dockerfile.tsecbench -t chronos-tsecbench:ci .
      - name: Offline container preflight
        run: |
          docker run --rm --network none \
            -e BENCHMARK_TOKEN=offline-preflight-placeholder \
            -e DEEPSEEK_API_KEY=offline-key-one \
            -e DEEPSEEK_API_KEY_2=offline-key-two \
            chronos-tsecbench:ci --preflight
      - run: |
          mkdir -p dist
          docker save chronos-tsecbench:ci | gzip -9 > dist/chronos-tsecbench-amd64.tar.gz
          test "$(wc -c < dist/chronos-tsecbench-amd64.tar.gz)" -lt 3221225472
          sha256sum dist/chronos-tsecbench-amd64.tar.gz > dist/chronos-tsecbench-amd64.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: chronos-tsecbench-amd64
          path: |
            dist/chronos-tsecbench-amd64.tar.gz
            dist/chronos-tsecbench-amd64.tar.gz.sha256
          retention-days: 7
